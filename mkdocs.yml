# =============================================================================
# 站点配置
# -----------------------------------------------------------------------------
# 内容约定：
#   - 中文页：docs/xxx.md
#   - 英文页：docs/xxx.en.md（没有英文版就自动回退中文）
#   - 会经常变的内容（研究方向、论文、更新）放到 data/*.yml
#   - 新增页面后记得加进 nav，或者登记到 not_in_nav 作为隐藏页
# =============================================================================

site_name: Zirui Li · 李梓瑞
site_url: https://ziruili-physics.github.io/
site_author: Zirui Li (李梓瑞)
site_description: >-
  李梓瑞的个人主页：理论物理研究、笔记与代码分享。
  Personal site of Zirui Li — theoretical physics, notes and code.

repo_url: https://github.com/ZiruiLi-physics/ziruili-physics.github.io
repo_name: ziruili-physics.github.io

# -----------------------------------------------------------------------------
# 主题
# -----------------------------------------------------------------------------
theme:
  name: material
  custom_dir: overrides
  logo: assets/catmaster.png
  favicon: assets/catmaster_favicon.png
  font: false
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - navigation.expand
    - header.autohide
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: 切换到暗色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: 切换到亮色模式

# -----------------------------------------------------------------------------
# 插件
# -----------------------------------------------------------------------------
plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: zh
          name: 中文
          default: true
          build: true
          site_name: Zirui Li · 李梓瑞
          site_description: 李梓瑞的个人主页：理论物理研究、笔记与代码分享。
          copyright: >-
            © 2026 Zirui Li · 文字与笔记 CC BY-NC-SA 4.0 · 代码 MIT ·
            <a class="zl-life-dot" href="/life/" aria-label="物理之外">✦</a>
        - locale: en
          name: English
          build: true
          site_name: Zirui Li · 李梓瑞
          site_description: >-
            Personal site of Zirui Li — theoretical physics, notes and code.
          copyright: >-
            © 2026 Zirui Li · text and notes CC BY-NC-SA 4.0 · code MIT ·
            <a class="zl-life-dot" href="/en/life/" aria-label="Beyond Physics">✦</a>
          nav_translations:
            首页: Home
            研究: Research
            笔记与代码: Notes & Code
            总览: Overview
            物理笔记: Physics Notes
            讲义与 Slides: Slides
            代码与工具: Code & Tools
            教学与串讲: Teaching
            写作: Writing
            关于: About
            关于我: About Me
            简历: CV
            物理与我: Physics & Me
            想对新物理人说的话: For Young Physicists
            本科课程归档: Undergraduate Archive

# -----------------------------------------------------------------------------
# 导航
# -----------------------------------------------------------------------------
nav:
  - 首页: index.md
  - 研究: research.md
  - 笔记与代码:
      - 总览: notes/index.md
      - 物理笔记: notes/physics.md
      - 讲义与 Slides: notes/slides.md
      - 代码与工具: notes/code.md
      - 教学与串讲: notes/teaching.md
  - 写作: blog/index.md
  - 关于:
      - 关于我: about/index.md
      - 简历: cv.md
      - 物理与我: about/physics-and-me.md
      - 想对新物理人说的话: about/advice.md
      - 本科课程归档: archive/index.md

# 生活页不进导航，靠页脚与悬浮入口进入
not_in_nav: |
  /life/

# 原件留在本机，网页简历使用 cv.md 和 cv.en.md
exclude_docs: |
  /cv/
  /archive/downloads/U3/homework_1_2_3.pdf
  /archive/downloads/U3/pxp_model.pdf

# -----------------------------------------------------------------------------
# 构建校验：隐藏页与绝对链接不打断 --strict
# -----------------------------------------------------------------------------
validation:
  nav:
    omitted_files: info
  links:
    absolute_links: info
    not_found: warn
    unrecognized_links: info

# -----------------------------------------------------------------------------
# 内容钩子：把 data/*.yml 渲染进页面
# -----------------------------------------------------------------------------
hooks:
  - hooks/content.py

watch:
  - data

# -----------------------------------------------------------------------------
# Markdown
# -----------------------------------------------------------------------------
markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - tables
  - footnotes
  - def_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde

# -----------------------------------------------------------------------------
# 资源
# -----------------------------------------------------------------------------
extra_css:
  - stylesheets/base.css
  - stylesheets/home.css
  - stylesheets/academic.css
  - stylesheets/life.css

extra_javascript:
  - javascripts/mathjax.js
  - javascripts/site.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ZiruiLi-physics
      name: GitHub
    - icon: fontawesome/brands/bilibili
      link: https://space.bilibili.com/228138236
      name: Bilibili
