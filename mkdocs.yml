site_name: Zirui Li (李梓瑞)的个人主页
site_url: https://ziruili-physics.github.io
site_author: Zirui Li (李梓瑞)
site_description: Zirui Li (李梓瑞)的个人主页

plugins: 
  - search
  - tags
  - i18n:
      default_language: zh
      languages:
        - locale: zh
          name: 中文
          build: true
          default: true
        - locale: en
          name: English
          build: true

theme: 
  name: material
  language: zh
  logo: assets/catmaster.png
  favicon: assets/catmaster_favicon.png
  font: 
    text: Microsoft YaHei
    code: JetBrains Mono
  features:
    - navigation.sections
    - header.autohide
    - navigation.tabs
    - navigation.path
    - navigation.top
    - search.suggest
    - search.highlight
    - navigation.expand
    - navigation.indexes
  palette:
    - primary: pink
    - accent: indigo
    - scheme: default
      primary: indigo
      accent: orange
      toggle:
        icon: material/weather-night
        name: 切换至夜间模式
    - scheme: slate
      primary: indigo
      accent: orange
      toggle:
        icon: material/weather-sunny
        name: 切换至日间模式
repo_url: https://github.com/ZiruiLi-physics/ziruili-physics.github.io
repo_name: ziruili-physics.github.io

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ZiruiLi-physics
      name: GitHub | Catmaster
    - icon: fontawesome/brands/bilibili
      link: https://space.bilibili.com/228138236
      name: BiliBili | 喵喵拳大师兄
  
  consent:
    title: Cookie consent
    description: >- 
      We use cookies to recognize your repeated visits and preferences, as well
      as to measure the effectiveness of our documentation and whether users
      find what they're searching for. With your consent, you're helping us to
      make our documentation better

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - attr_list
  - toc:
      permalink: true
  - pymdownx.highlight:
      linenums: true
  - pymdownx.superfences
  - meta
  - pymdownx.tilde
  - admonition
  - tables
  - footnotes
  - def_list
  - pymdownx.emoji
  - pymdownx.tasklist
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.inlinehilite
  - pymdownx.snippets

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - 主页: index.md
  - 关于:
      - 个人简历: cv.md
      - 物理与我: about.md
      - 想对新物理人说的话: chat.md
  - 研究:
      - 研究兴趣: research.md
  - 笔记与教学:
      - 物理笔记:
          - PDF: physics/note/pdf.md
          - Slides: physics/note/slides.md
          - Code: physics/note/code.md
      - BUAA课程资料:
          - 大一 | 致真书院: buaa/U1.md
          - 大二 | 物理学院: buaa/U2.md
          - 大三 | 核物理: buaa/U3.md
          - 大四 | 核物理: buaa/U4.md
  - 博客: blog/index.md
  - ACG:
      - 动画: acg/animation.md
      - 游戏: acg/game.md